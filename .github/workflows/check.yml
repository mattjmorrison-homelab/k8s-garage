name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v3.21.4"
      # k8s-garage's chart depends on the k8s-ci-rbac library chart, pulled
      # from the private registry -- needs a read credential first. See
      # admin-openbao's k8s-garage-pull-helm-libs role and k8s-zot's
      # serviceConsumers (provider/consumer service-credential pattern).
      - name: Fetch pull-helm-libs credential from OpenBao
        env:
          VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
        run: |
          JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          LOGIN_PAYLOAD=$(jq -n --arg jwt "$JWT" --arg role k8s-garage-pull-helm-libs '{jwt: $jwt, role: $role}')
          CLIENT_TOKEN=$(curl -sf -X POST "$VAULT_ADDR/v1/auth/kubernetes/login" -d "$LOGIN_PAYLOAD" \
            | jq -r '.auth.client_token')

          ZOT_PULL_PASSWORD=$(curl -sf -H "X-Vault-Token: $CLIENT_TOKEN" \
            "$VAULT_ADDR/v1/kv/data/homelab/service/k8s-zot/k8s-garage/pull-helm-libs" \
            | jq -r '.data.data.value')

          echo "::add-mask::$ZOT_PULL_PASSWORD"
          echo "ZOT_PULL_PASSWORD=$ZOT_PULL_PASSWORD" >> "$GITHUB_ENV"
      - name: Log in to registry
        run: helm registry login registry.morrisons.site -u k8s-garage --password-stdin <<< "$ZOT_PULL_PASSWORD"
      - uses: mattjmorrison-homelab/actions-helm@334a61d6bcc3a64cd014336c633a35f54443fb00
        with:
          namespace: garage
