apiVersion: batch/v1
kind: Job
metadata:
  name: garage-bootstrap-secrets
  namespace: garage
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: garage
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: alpine:3.20
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            - name: OPENBAO_ADDR
              value: "http://homelab-openbao.openbao.svc:8200"
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: garage-bootstrap-secrets-script
            defaultMode: 0555
