apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-bootstrap-secrets-script
  namespace: garage
  annotations:
    argocd.argoproj.io/hook: PreSync
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    apk add --no-cache curl jq openssl >/dev/null

    SA_JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    VAULT_TOKEN_SELF=$(curl -sf -X POST "$OPENBAO_ADDR/v1/auth/kubernetes/login" \
      -d "{\"jwt\": \"$SA_JWT\", \"role\": \"garage\"}" | jq -r .auth.client_token)

    # 404s if the secret doesn't exist yet at all -- treat that the same as "no data"
    EXISTING=$(curl -sf -H "X-Vault-Token: $VAULT_TOKEN_SELF" \
      "$OPENBAO_ADDR/v1/kv/data/homelab/k8s-garage/rpc-secret" || echo '{}')
    HAS_RPC=$(echo "$EXISTING" | jq -r '.data.data.value // empty')

    if [ -n "$HAS_RPC" ]; then
      echo "Secrets already present in kv/homelab/k8s-garage, skipping."
      exit 0
    fi

    echo "No secrets found, minting rpc_secret/admin_token/metrics_token..."
    RPC_SECRET=$(openssl rand -hex 32)
    ADMIN_TOKEN=$(openssl rand -base64 32)
    METRICS_TOKEN=$(openssl rand -base64 32)

    curl -sf -X POST -H "X-Vault-Token: $VAULT_TOKEN_SELF" \
      -H "Content-Type: application/json" \
      -d "{\"data\": {\"value\": \"$RPC_SECRET\"}}" \
      "$OPENBAO_ADDR/v1/kv/data/homelab/k8s-garage/rpc-secret" > /dev/null

    curl -sf -X POST -H "X-Vault-Token: $VAULT_TOKEN_SELF" \
      -H "Content-Type: application/json" \
      -d "{\"data\": {\"value\": \"$ADMIN_TOKEN\"}}" \
      "$OPENBAO_ADDR/v1/kv/data/homelab/k8s-garage/admin-token" > /dev/null

    curl -sf -X POST -H "X-Vault-Token: $VAULT_TOKEN_SELF" \
      -H "Content-Type: application/json" \
      -d "{\"data\": {\"value\": \"$METRICS_TOKEN\"}}" \
      "$OPENBAO_ADDR/v1/kv/data/homelab/k8s-garage/metrics-token" > /dev/null

    echo "Stored new rpc_secret/admin_token/metrics_token in kv/homelab/k8s-garage."
