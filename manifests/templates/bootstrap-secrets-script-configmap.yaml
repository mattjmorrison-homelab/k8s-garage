apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-bootstrap-secrets-script
  namespace: garage
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    apk add --no-cache curl jq openssl >/dev/null

    SA_JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    VAULT_TOKEN_SELF=$(curl -sf -X POST "$OPENBAO_ADDR/v1/auth/kubernetes/login" \
      -d "{\"jwt\": \"$SA_JWT\", \"role\": \"garage\"}" | jq -r .auth.client_token)

    # 404s if the secret doesn't exist yet at all -- treat that the same as "no data"
    EXISTING=$(curl -sf -H "X-Vault-Token: $VAULT_TOKEN_SELF" \
      "$OPENBAO_ADDR/v1/kv/data/homelab/garage" || echo '{}')

    EXISTING_DATA=$(echo "$EXISTING" | jq -c '.data.data // {}')
    HAS_RPC=$(echo "$EXISTING_DATA" | jq -r '.RPC_SECRET // empty')

    if [ -n "$HAS_RPC" ]; then
      echo "Secrets already present in kv/homelab/garage, skipping."
      exit 0
    fi

    echo "No secrets found, minting rpc_secret/admin_token/metrics_token..."
    RPC_SECRET=$(openssl rand -hex 32)
    ADMIN_TOKEN=$(openssl rand -base64 32)
    METRICS_TOKEN=$(openssl rand -base64 32)

    MERGED=$(echo "$EXISTING_DATA" | jq \
      --arg rpc "$RPC_SECRET" --arg admin "$ADMIN_TOKEN" --arg metrics "$METRICS_TOKEN" \
      '. + {RPC_SECRET: $rpc, ADMIN_TOKEN: $admin, METRICS_TOKEN: $metrics}')

    curl -sf -X POST -H "X-Vault-Token: $VAULT_TOKEN_SELF" \
      -H "Content-Type: application/json" \
      -d "{\"data\": $MERGED}" \
      "$OPENBAO_ADDR/v1/kv/data/homelab/garage" > /dev/null

    echo "Stored new rpc_secret/admin_token/metrics_token in kv/homelab/garage."
