apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"

    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "garage.garage.svc.cluster.local:3901"
    # rpc_secret / admin_token / metrics_token come from the GARAGE_RPC_SECRET
    # / GARAGE_ADMIN_TOKEN / GARAGE_METRICS_TOKEN env vars (garage-secrets
    # Secret), not inline here.

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.morrisons.site"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.morrisons.site"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
