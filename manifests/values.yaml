image:
  repository: dxflrs/garage
  digest: sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690 # v2.3.0

verify:
  image:
    repository: alpine
    digest: sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc # 3.20

storage:
  size: 20Gi

# Bytes, must match storage.size — Garage's layout assignment needs an
# explicit capacity per node even in a single-node setup.
capacityBytes: 21474836480

# Every Terraform repo needing its own Garage tofu-state bucket + key
# (Phase 1b of the secrets-standard-compliance work -- one bucket/key
# per repo, replacing the old single shared bucket every repo used to
# read from admin-github's own OpenBao path). Re-grep `backend "s3"`
# across all repos before adding a new one here, in case this list has
# grown.
tofuStateRepos:
  - admin-discord
  - admin-github
  - admin-openbao
  - admin-cloudflare

# Repos currently mid-Phase-1b-migration off the old shared tofu-state
# bucket -- each entry temporarily grants (or later revokes) that
# repo's own new key read access to the old bucket, just for the one
# tofu init -migrate-state step. Empty when nothing's mid-migration;
# add an entry with action "grant" right before that repo's migration
# workflow runs. The grant does NOT expire on its own -- Garage's ACL
# just sits there until explicitly changed, so simply removing the
# entry afterward leaves it granted. Flip action to "revoke" instead
# (a real PR, applied, confirmed by the Job's own log line) immediately
# after the migration is confirmed live, then remove the entry once
# revoked. Must never sit at "grant" longer than that one step.
tofuStateMigrationGrants:
  - repo: admin-openbao
    action: revoke
